<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камень дорогой — Учебный интернет-магазин</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="index.html">Камни</a>
            <nav class="site-nav" aria-label="Основная навигация">
                <ul class="site-nav__list">
                    <li><a class="site-nav__link" href="index.html">Главная</a></li>
                    <li><a class="site-nav__link" href="catalog.html">Каталог</a></li>
                    <li><a class="site-nav__link site-nav__link--active" href="product.html">Товар</a></li>
                    <li><a class="site-nav__link" href="order.html">Заявка</a></li>
                    <li><a class="site-nav__link" href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <h1 class="section__title">Камень дорогой</h1>
            <div class="product-detail">
                <div>
                    <img class="product-detail__image" src="https://cs6.livemaster.ru/storage/e7/f3/16010c7eff672c072117bc1491xf.jpg" alt="Камень дорогой">
                </div>
                <div class="product-detail__info">
                    <p class="product-detail__price">Цена: 1 000 000 руб.</p>
                    <p class="product-card__description">Идеальная форма камня, крутая эстетика, очень интересный.</p>
                    <h2>Характеристики</h2>
                    <div class="table-wrapper">
                        <table class="product-table">
                            <thead>
                                <tr><th>Параметр</th><th>Значение</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>Категория</td><td>Учебный товар</td></tr>
                                <tr><td>Цена</td><td>1 000 000 руб.</td></tr>
                                <tr><td>Наличие</td><td>В наличии</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <button class="button button--primary" style="max-width: 300px; margin-bottom: 10px;">Заказать</button>
                    <a class="button button--secondary" href="catalog.html" style="max-width: 300px;">Вернуться в каталог</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Учебный проект.</p>
    </footer>
